<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>BeeRun | Planning</title>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400&family=Inconsolata:wght@400;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    #planning-root {
      background: #000;
      min-height: calc(100vh - 80px);
      margin-top: 80px;
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar scrolled" id="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand">
        <div class="logo-text">BeeRun</div>
      </a>
      <div class="nav-menu" id="navMenu">
        <a href="index.html#location" class="nav-item">Location</a>
        <a href="planning.html" class="nav-item" style="color:#fff">Planning</a>
        <a href="index.html#schedule" class="nav-item">Schedule</a>
        <a href="index.html#availability" class="nav-item">Availability</a>
        <a href="#" class="nav-item nav-btn">Login</a>
      </div>
    </div>
  </nav>

  <div id="planning-root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    /* ── Inline icon components ── */
    const IconCalendar = () => (
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
    );
    const IconBeer = () => (
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M17 11h1a3 3 0 0 1 0 6h-1"/><path d="M9 12v6"/><path d="M13 12v6"/><path d="M14 7.5c-1 0-1.44.5-3 .5s-2-.5-3-.5-1.44.5-3 .5"/><path d="M5 8c0-1.7 0-4 5-4s5 2.3 5 4v9a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2Z"/>
      </svg>
    );
    const IconRunning = () => (
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="13" cy="4" r="1"/><path d="m7 21 3-6"/><path d="m16 21-3-3-1-5 3-3"/><path d="m11 7 3.5 1.5L17 6"/><path d="M7 13.5 8.5 12 11 13"/>
      </svg>
    );
    const IconTrophy = () => (
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>
      </svg>
    );
    const IconCheckIn = () => (
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>
      </svg>
    );
    const IconZap = () => (
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
      </svg>
    );
    const IconLink = () => (
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
      </svg>
    );
    const IconArrowRight = () => (
      <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
      </svg>
    );

    /* ── Minimal shadcn replacements ── */
    const Badge = ({ className = "", children }) => (
      <span className={`inline-flex items-center rounded-full border px-2.5 py-0.5 text-xs font-semibold ${className}`}>
        {children}
      </span>
    );
    const Button = ({ className = "", onClick, children }) => (
      <button onClick={onClick} className={`inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors ${className}`}>
        {children}
      </button>
    );
    const Card = ({ className = "", children }) => (
      <div className={`rounded-lg border bg-card text-card-foreground shadow-sm ${className}`}>{children}</div>
    );
    const CardHeader = ({ className = "", children }) => (
      <div className={`flex flex-col space-y-1.5 p-6 ${className}`}>{children}</div>
    );
    const CardTitle = ({ className = "", children }) => (
      <h3 className={`text-2xl font-semibold leading-none tracking-tight ${className}`}>{children}</h3>
    );
    const CardContent = ({ className = "", children }) => (
      <div className={`p-6 pt-0 ${className}`}>{children}</div>
    );

    /* ── Timeline data (BeeRun themed) ── */
    const timelineData = [
      {
        id: 1,
        title: "Anmeldung",
        date: "Woche 1",
        content: "Registrierung der Teilnehmer, Team-Einteilung und Ausgabe der Startnummern.",
        category: "Planning",
        icon: IconCalendar,
        relatedIds: [2],
        status: "completed",
        energy: 100,
      },
      {
        id: 2,
        title: "Training",
        date: "Woche 2–3",
        content: "Gemeinsames Aufwärmtraining und Streckenbegehung im Englischen Garten.",
        category: "Training",
        icon: IconRunning,
        relatedIds: [1, 3],
        status: "completed",
        energy: 85,
      },
      {
        id: 3,
        title: "Check-in",
        date: "Renntag 08:00",
        content: "Offizieller Check-in am Amphitheater, Ausgabe der Chips und letztes Briefing.",
        category: "Event",
        icon: IconCheckIn,
        relatedIds: [2, 4],
        status: "in-progress",
        energy: 65,
      },
      {
        id: 4,
        title: "Lauf",
        date: "Renntag 10:00",
        content: "Der BeeRun startet! 5km Lauf durch den Englischen Garten mit Bierkrug-Pflicht.",
        category: "Race",
        icon: IconRunning,
        relatedIds: [3, 5],
        status: "pending",
        energy: 40,
      },
      {
        id: 5,
        title: "Siegerehrung",
        date: "Renntag 12:00",
        content: "Preisverleihung an die schnellsten Teams, anschließend gemeinsames Bierfest.",
        category: "Award",
        icon: IconTrophy,
        relatedIds: [4, 6],
        status: "pending",
        energy: 25,
      },
      {
        id: 6,
        title: "Bierfest",
        date: "Renntag 13:00",
        content: "Entspannter Ausklang mit kühlem Bier und guter Musik am Amphitheater.",
        category: "Party",
        icon: IconBeer,
        relatedIds: [5],
        status: "pending",
        energy: 10,
      },
    ];

    /* ── Main component ── */
    function RadialOrbitalTimeline({ timelineData }) {
      const [expandedItems, setExpandedItems] = useState({});
      const [rotationAngle, setRotationAngle] = useState(0);
      const [autoRotate, setAutoRotate] = useState(true);
      const [pulseEffect, setPulseEffect] = useState({});
      const [activeNodeId, setActiveNodeId] = useState(null);
      const containerRef = useRef(null);
      const orbitRef = useRef(null);
      const nodeRefs = useRef({});

      const handleContainerClick = (e) => {
        if (e.target === containerRef.current || e.target === orbitRef.current) {
          setExpandedItems({});
          setActiveNodeId(null);
          setPulseEffect({});
          setAutoRotate(true);
        }
      };

      const toggleItem = (id) => {
        setExpandedItems((prev) => {
          const newState = {};
          Object.keys(prev).forEach((key) => { newState[parseInt(key)] = false; });
          newState[id] = !prev[id];

          if (!prev[id]) {
            setActiveNodeId(id);
            setAutoRotate(false);
            const relatedItems = getRelatedItems(id);
            const newPulse = {};
            relatedItems.forEach((relId) => { newPulse[relId] = true; });
            setPulseEffect(newPulse);
          } else {
            setActiveNodeId(null);
            setAutoRotate(true);
            setPulseEffect({});
          }
          return newState;
        });
      };

      useEffect(() => {
        let timer;
        if (autoRotate) {
          timer = setInterval(() => {
            setRotationAngle((prev) => Number(((prev + 0.3) % 360).toFixed(3)));
          }, 50);
        }
        return () => clearInterval(timer);
      }, [autoRotate]);

      const calculateNodePosition = (index, total) => {
        const angle = ((index / total) * 360 + rotationAngle) % 360;
        const radius = 200;
        const radian = (angle * Math.PI) / 180;
        const x = radius * Math.cos(radian);
        const y = radius * Math.sin(radian);
        const zIndex = Math.round(100 + 50 * Math.cos(radian));
        const opacity = Math.max(0.4, Math.min(1, 0.4 + 0.6 * ((1 + Math.sin(radian)) / 2)));
        return { x, y, zIndex, opacity };
      };

      const getRelatedItems = (itemId) => {
        const item = timelineData.find((i) => i.id === itemId);
        return item ? item.relatedIds : [];
      };

      const isRelatedToActive = (itemId) => {
        if (!activeNodeId) return false;
        return getRelatedItems(activeNodeId).includes(itemId);
      };

      const getStatusStyles = (status) => {
        switch (status) {
          case "completed":   return "text-white bg-black border-white";
          case "in-progress": return "text-black bg-white border-black";
          default:            return "text-white bg-black/40 border-white/50";
        }
      };

      return (
        <div
          className="w-full flex flex-col items-center justify-center bg-black overflow-hidden"
          style={{ height: "calc(100vh - 80px)" }}
          ref={containerRef}
          onClick={handleContainerClick}
        >
          <div className="relative w-full max-w-4xl h-full flex items-center justify-center">
            <div
              className="absolute w-full h-full flex items-center justify-center"
              ref={orbitRef}
              style={{ perspective: "1000px" }}
            >
              {/* Centre orb */}
              <div className="absolute w-16 h-16 rounded-full bg-gradient-to-br from-blue-600 via-blue-400 to-blue-300 animate-pulse flex items-center justify-center z-10">
                <div className="absolute w-20 h-20 rounded-full border border-white/20 animate-ping opacity-70"></div>
                <div className="absolute w-24 h-24 rounded-full border border-white/10 animate-ping opacity-50" style={{ animationDelay: "0.5s" }}></div>
                <div className="w-8 h-8 rounded-full bg-white/80 backdrop-blur-md"></div>
              </div>

              {/* Orbit ring */}
              <div className="absolute w-96 h-96 rounded-full border border-white/10"></div>

              {timelineData.map((item, index) => {
                const position = calculateNodePosition(index, timelineData.length);
                const isExpanded = expandedItems[item.id];
                const isRelated = isRelatedToActive(item.id);
                const isPulsing = pulseEffect[item.id];
                const Icon = item.icon;

                return (
                  <div
                    key={item.id}
                    ref={(el) => (nodeRefs.current[item.id] = el)}
                    className="absolute transition-all duration-700 cursor-pointer"
                    style={{
                      transform: `translate(${position.x}px, ${position.y}px)`,
                      zIndex: isExpanded ? 200 : position.zIndex,
                      opacity: isExpanded ? 1 : position.opacity,
                    }}
                    onClick={(e) => { e.stopPropagation(); toggleItem(item.id); }}
                  >
                    {/* Glow */}
                    <div
                      className={`absolute rounded-full ${isPulsing ? "animate-pulse" : ""}`}
                      style={{
                        background: "radial-gradient(circle, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 70%)",
                        width: `${item.energy * 0.5 + 40}px`,
                        height: `${item.energy * 0.5 + 40}px`,
                        left: `-${(item.energy * 0.5 + 40 - 40) / 2}px`,
                        top: `-${(item.energy * 0.5 + 40 - 40) / 2}px`,
                      }}
                    />

                    {/* Node circle */}
                    <div className={`
                      w-10 h-10 rounded-full flex items-center justify-center border-2 transition-all duration-300
                      ${isExpanded ? "bg-white text-black border-white shadow-lg scale-150" :
                        isRelated ? "bg-white/50 text-black border-white animate-pulse" :
                        "bg-black text-white border-white/40"}
                    `}>
                      <Icon />
                    </div>

                    {/* Label */}
                    <div className={`absolute top-12 whitespace-nowrap text-xs font-semibold tracking-wider transition-all duration-300 ${isExpanded ? "text-white scale-125" : "text-white/70"}`}
                      style={{ transform: isExpanded ? "translateX(-50%) scale(1.25)" : "translateX(-50%)", left: "50%" }}>
                      {item.title}
                    </div>

                    {/* Expanded card */}
                    {isExpanded && (
                      <div className="absolute top-20 w-64 bg-black/90 backdrop-blur-lg border border-white/30 shadow-xl rounded-lg overflow-visible"
                        style={{ left: "50%", transform: "translateX(-50%)" }}>
                        <div className="absolute -top-3 left-1/2 -translate-x-1/2 w-px h-3 bg-white/50"></div>
                        <div className="p-4 pb-2">
                          <div className="flex justify-between items-center">
                            <Badge className={`px-2 text-xs ${getStatusStyles(item.status)}`}>
                              {item.status === "completed" ? "DONE" : item.status === "in-progress" ? "AKTIV" : "AUSSTEHEND"}
                            </Badge>
                            <span className="text-xs font-mono text-white/50">{item.date}</span>
                          </div>
                          <h3 className="text-sm font-semibold text-white mt-2">{item.title}</h3>
                        </div>
                        <div className="px-4 pb-4 text-xs text-white/80">
                          <p>{item.content}</p>

                          <div className="mt-4 pt-3 border-t border-white/10">
                            <div className="flex justify-between items-center text-xs mb-1">
                              <span className="flex items-center gap-1"><IconZap /> Energie</span>
                              <span className="font-mono">{item.energy}%</span>
                            </div>
                            <div className="w-full h-1 bg-white/10 rounded-full overflow-hidden">
                              <div className="h-full bg-gradient-to-r from-blue-500 to-blue-300" style={{ width: `${item.energy}%` }}></div>
                            </div>
                          </div>

                          {item.relatedIds.length > 0 && (
                            <div className="mt-4 pt-3 border-t border-white/10">
                              <div className="flex items-center mb-2 gap-1">
                                <IconLink />
                                <span className="text-xs uppercase tracking-wider font-medium text-white/70">Verbunden</span>
                              </div>
                              <div className="flex flex-wrap gap-1">
                                {item.relatedIds.map((relId) => {
                                  const rel = timelineData.find((i) => i.id === relId);
                                  return (
                                    <button
                                      key={relId}
                                      className="flex items-center gap-1 h-6 px-2 text-xs border border-white/20 bg-transparent hover:bg-white/10 text-white/80 hover:text-white rounded transition-all"
                                      onClick={(e) => { e.stopPropagation(); toggleItem(relId); }}
                                    >
                                      {rel?.title} <IconArrowRight />
                                    </button>
                                  );
                                })}
                              </div>
                            </div>
                          )}
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("planning-root")).render(
      <RadialOrbitalTimeline timelineData={timelineData} />
    );
  </script>

  <script>
    // Navbar scroll
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => {
      navbar.classList.toggle('scrolled', window.scrollY > 40);
    });
  </script>
</body>
</html>
